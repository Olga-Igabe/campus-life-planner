<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tests — Campus Life Planner</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1.5rem; color: #1e293b; background: #f8fafc; }
    h1 { margin-top: 0; }
    h2 { margin-top: 1.5rem; font-size: 1.125rem; }
    #summary { font-weight: 700; font-size: 1.125rem; }
    .pass { color: #166534; }
    .fail { color: #b91c1c; font-weight: 700; }
    li { margin-bottom: 0.25rem; }
  </style>
</head>
<body>
  <main>
    <h1>Campus Life Planner tests</h1>
    <p id="summary" role="status"></p>
    <div id="results"></div>
  </main>

  <script type="module">
    import {
      validateTitle,
      validateDuration,
      validateDate,
      validateTag,
      validateCap,
      findDuplicateWord
    } from '../scripts/validators.js';
    import { buildSearch, taskMatches, splitMatches } from '../scripts/search.js';
    import { setTasks, getTasks, addTask, updateTask, deleteTask, sortTasks } from '../scripts/state.js';
    import { totalMinutes, topTag, lastSevenDays, weekRange, capStatus, formatHours } from '../scripts/stats.js';
    import { parseImport, validateTaskList, cleanSettings } from '../scripts/storage.js';

    const results = document.getElementById('results');
    let currentList = null;
    let passed = 0;
    let failed = 0;

    function group(title) {
      const heading = document.createElement('h2');
      heading.textContent = title;
      currentList = document.createElement('ol');
      results.append(heading, currentList);
    }

    function check(name, actual, expected) {
      const ok = actual === expected;
      if (ok) {
        passed += 1;
      } else {
        failed += 1;
      }
      const item = document.createElement('li');
      item.className = ok ? 'pass' : 'fail';
      item.textContent = ok
        ? `PASS: ${name}`
        : `FAIL: ${name} (expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)})`;
      currentList.append(item);
    }

    const isValid = (validate, value) => validate(value) === '';

    group('Title');
    check('"Gym session" is valid', isValid(validateTitle, 'Gym session'), true);
    check('"A" (one character) is valid', isValid(validateTitle, 'A'), true);
    check('leading space is invalid', isValid(validateTitle, ' Gym'), false);
    check('trailing space is invalid', isValid(validateTitle, 'Gym '), false);
    check('double space is invalid', isValid(validateTitle, 'Gym  session'), false);
    check('repeated word is invalid', isValid(validateTitle, 'Read the the notes'), false);
    check('repeated word is caught across cases', isValid(validateTitle, 'The the plan'), false);
    check('empty title is invalid', isValid(validateTitle, ''), false);

    group('Duration');
    check('"90" is valid', isValid(validateDuration, '90'), true);
    check('"1" is valid', isValid(validateDuration, '1'), true);
    check('"0" is invalid', isValid(validateDuration, '0'), false);
    check('"090" is invalid', isValid(validateDuration, '090'), false);
    check('"45.5" is invalid', isValid(validateDuration, '45.5'), false);
    check('"-5" is invalid', isValid(validateDuration, '-5'), false);
    check('"abc" is invalid', isValid(validateDuration, 'abc'), false);
    check('empty duration is invalid', isValid(validateDuration, ''), false);

    group('Due date');
    check('"2026-10-14" is valid', isValid(validateDate, '2026-10-14'), true);
    check('leap day "2028-02-29" is valid', isValid(validateDate, '2028-02-29'), true);
    check('"2026-02-29" (not a leap year) is invalid', isValid(validateDate, '2026-02-29'), false);
    check('"2026-02-30" is invalid', isValid(validateDate, '2026-02-30'), false);
    check('"2026-13-01" is invalid', isValid(validateDate, '2026-13-01'), false);
    check('"14/10/2026" is invalid', isValid(validateDate, '14/10/2026'), false);
    check('"2026-1-5" is invalid', isValid(validateDate, '2026-1-5'), false);

    group('Tag');
    check('"Study" is valid', isValid(validateTag, 'Study'), true);
    check('"Club-Meeting" is valid', isValid(validateTag, 'Club-Meeting'), true);
    check('"Self Study" is valid', isValid(validateTag, 'Self Study'), true);
    check('"Study!" is invalid', isValid(validateTag, 'Study!'), false);
    check('"-Club" is invalid', isValid(validateTag, '-Club'), false);
    check('"Club  Meeting" (double space) is invalid', isValid(validateTag, 'Club  Meeting'), false);
    check('"Study2" is invalid', isValid(validateTag, 'Study2'), false);

    group('Weekly cap');
    check('"20" is valid', isValid(validateCap, '20'), true);
    check('"0" is invalid', isValid(validateCap, '0'), false);
    check('"2.5" is invalid', isValid(validateCap, '2.5'), false);

    group('Advanced regex: back-reference');
    check('finds "the" in "Read the the notes"', findDuplicateWord('Read the the notes'), 'the');
    check('finds nothing in "Read the notes"', findDuplicateWord('Read the notes'), null);
    check('ignores "the theory"', findDuplicateWord('the theory'), null);
    check('finds "Study" in "Study study group"', findDuplicateWord('Study study group'), 'Study');

    group('Regex search');
    const exam = { id: 'task_0001', title: 'Final Exam at 10:30', dueDate: '2026-10-20', duration: 120, tag: 'Class' };
    const gym = { id: 'task_0002', title: 'Gym session', dueDate: '2026-10-15', duration: 60, tag: 'Sports' };
    check('empty search is inactive', buildSearch('', true).active, false);
    check('"(" is caught as invalid regex', buildSearch('(', true).valid, false);
    check('invalid regex shows every task', taskMatches(gym, buildSearch('(', true)), true);
    check('"exam" matches "Final Exam" when ignoring case', taskMatches(exam, buildSearch('exam', true)), true);
    check('"exam" does not match "Final Exam" when case matters', taskMatches(exam, buildSearch('exam', false)), false);
    check('time token \\b\\d{2}:\\d{2}\\b matches "10:30"', taskMatches(exam, buildSearch('\\b\\d{2}:\\d{2}\\b', true)), true);
    check('"@tag:Sports" filters by tag', taskMatches(gym, buildSearch('@tag:Sports', true)), true);
    check('"@tag:Sports" excludes other tags', taskMatches(exam, buildSearch('@tag:Sports', true)), false);
    check('"@tag:" with nothing after it is inactive', buildSearch('@tag:', true).active, false);

    group('Highlighting');
    const parts = splitMatches('Read the notes', /the/);
    check('splits "Read the notes" into 3 parts', parts.length, 3);
    check('middle part is the match', parts[1].match && parts[1].text === 'the', true);
    check('zero-length pattern does not freeze', splitMatches('abc', /x*/).length, 1);
    check('every match is found, not just the first', splitMatches('a-a-a', /a/).filter((p) => p.match).length, 3);

    group('State and sorting');
    setTasks([]);
    const first = addTask({ title: 'Lab report', dueDate: '2026-10-16', duration: '45', tag: 'Assignment' });
    check('first id is task_0001', first.id, 'task_0001');
    check('duration is stored as a number', first.duration, 45);
    check('createdAt equals updatedAt for a new task', first.createdAt === first.updatedAt, true);
    setTasks([{ ...exam, id: 'task_0007', createdAt: '2026-10-01T00:00:00.000Z', updatedAt: '2026-10-01T00:00:00.000Z' }]);
    check('next id continues after the highest existing id', addTask({ title: 'Read', dueDate: '2026-10-17', duration: '30', tag: 'Study' }).id, 'task_0008');
    const updated = updateTask('task_0007', { title: 'Final exam', dueDate: '2026-10-21', duration: '90', tag: 'Class' });
    check('update keeps createdAt', updated.createdAt, '2026-10-01T00:00:00.000Z');
    check('update changes updatedAt', updated.updatedAt !== '2026-10-01T00:00:00.000Z', true);
    check('delete removes the task', deleteTask('task_0008') && getTasks().length === 1, true);
    check('deleting a missing id returns false', deleteTask('task_9999'), false);

    const list = [exam, gym, { id: 'task_0003', title: 'art club', dueDate: '2026-10-18', duration: 30, tag: 'Meeting' }];
    check('due date ascending puts the soonest first', sortTasks(list, 'dueDate-asc')[0].id, 'task_0002');
    check('due date descending puts the latest first', sortTasks(list, 'dueDate-desc')[0].id, 'task_0001');
    check('title A to Z ignores upper/lower case', sortTasks(list, 'title-asc')[0].title, 'art club');
    check('duration descending puts the longest first', sortTasks(list, 'duration-desc')[0].duration, 120);
    check('duration ascending puts the shortest first', sortTasks(list, 'duration-asc')[0].duration, 30);
    check('sorting does not change the original list', list[0].id, 'task_0001');

    group('Dashboard stats and weekly cap');
    const wednesday = new Date(2026, 9, 14);
    const week = [
      { id: 'task_0001', title: 'Lecture', dueDate: '2026-10-12', duration: 90, tag: 'Class' },
      { id: 'task_0002', title: 'Essay', dueDate: '2026-10-14', duration: 120, tag: 'Assignment' },
      { id: 'task_0003', title: 'Seminar', dueDate: '2026-10-18', duration: 60, tag: 'Class' },
      { id: 'task_0004', title: 'Old quiz', dueDate: '2026-10-08', duration: 30, tag: 'Study' },
      { id: 'task_0005', title: 'Next week', dueDate: '2026-10-19', duration: 45, tag: 'Study' }
    ];
    check('total minutes adds every task', totalMinutes(week), 345);
    check('total minutes of an empty list is 0', totalMinutes([]), 0);
    check('top tag is the most frequent tag', topTag(week).tag, 'Class');
    check('top tag of an empty list is null', topTag([]), null);
    check('tie on count picks the tag that comes first alphabetically', topTag([week[1], week[3]]).tag, 'Assignment');
    check('week starts on Monday', weekRange(wednesday).start, '2026-10-12');
    check('week ends on Sunday', weekRange(wednesday).end, '2026-10-18');
    check('Sunday belongs to the week that started on Monday', weekRange(new Date(2026, 9, 18)).start, '2026-10-12');
    const days = lastSevenDays(week, wednesday);
    check('chart has 7 days', days.length, 7);
    check('chart starts 6 days before today', days[0].date, '2026-10-08');
    check('chart ends today', days[6].date, '2026-10-14');
    check('chart day sums its tasks', days[6].minutes, 120);
    check('cap counts only tasks due this week', capStatus(week, 20, wednesday).usedMinutes, 270);
    check('under the cap is not over', capStatus(week, 20, wednesday).over, false);
    check('4 h cap is exceeded by 270 minutes', capStatus(week, 4, wednesday).over, true);
    check('exactly at the cap is not over', capStatus(week, 4.5, wednesday).over, false);
    check('remaining minutes go negative when over', capStatus(week, 4, wednesday).remainingMinutes, -30);
    check('90 minutes formats as 1.5 h', formatHours(90), '1.5 h');
    check('20 minutes rounds to 0.33 h', formatHours(20), '0.33 h');

    group('Import validation (JSON round trip)');
    const stamp = '2026-10-12T08:00:00.000Z';
    const good = { id: 'task_0001', title: 'Lab report', dueDate: '2026-10-16', duration: 45, tag: 'Assignment', createdAt: stamp, updatedAt: stamp };
    const withChange = (changes) => JSON.stringify([{ ...good, ...changes }]);
    check('text that is not JSON is rejected', parseImport('not json').ok, false);
    check('an object instead of a list is rejected', parseImport('{}').ok, false);
    check('an empty list is accepted', parseImport('[]').ok, true);
    check('a valid task is accepted', parseImport(JSON.stringify([good])).ok, true);
    check('export then import gives back the same tasks', JSON.stringify(parseImport(JSON.stringify([good])).tasks), JSON.stringify([good]));
    check('a missing id is rejected', parseImport(withChange({ id: undefined })).ok, false);
    check('an id in the wrong format is rejected', parseImport(withChange({ id: 'abc' })).ok, false);
    check('duplicate ids are rejected', parseImport(JSON.stringify([good, good])).ok, false);
    check('a title with a leading space is rejected', parseImport(withChange({ title: ' Lab' })).ok, false);
    check('an impossible date is rejected', parseImport(withChange({ dueDate: '2026-02-30' })).ok, false);
    check('a decimal duration is rejected', parseImport(withChange({ duration: 12.5 })).ok, false);
    check('a duration stored as text is rejected', parseImport(withChange({ duration: '45' })).ok, false);
    check('a tag with symbols is rejected', parseImport(withChange({ tag: 'Study!' })).ok, false);
    check('a missing timestamp is rejected', parseImport(withChange({ createdAt: 'yesterday' })).ok, false);
    check('the error names the task that failed', parseImport(JSON.stringify([good, { ...good, id: 'task_0002', tag: '' }])).error.startsWith('Task 2'), true);
    check('unknown extra fields are dropped', 'extra' in parseImport(withChange({ extra: 'x' })).tasks[0], false);

    group('Settings clean-up');
    check('an unknown unit falls back to minutes', cleanSettings({ unit: 'days' }).unit, 'minutes');
    check('hours is kept as a unit', cleanSettings({ unit: 'hours' }).unit, 'hours');
    check('a cap of 0 falls back to 20', cleanSettings({ weeklyCapHours: 0 }).weeklyCapHours, 20);
    check('invalid and repeated tags are removed', cleanSettings({ tags: ['Study', 'Study', 'Bad!'] }).tags.join(','), 'Study');
    check('missing settings give the defaults', cleanSettings(null).tags.length, 7);

    group('seed.json');
    try {
      const response = await fetch('../seed.json');
      const seed = validateTaskList(await response.json());
      check('seed.json passes import validation', seed.ok, true);
      check('seed.json has at least 10 tasks', seed.ok && seed.tasks.length >= 10, true);
      check('seed.json includes a leap day', seed.ok && seed.tasks.some((task) => task.dueDate.endsWith('-02-29')), true);
      check('seed.json includes a 1-minute task', seed.ok && seed.tasks.some((task) => task.duration === 1), true);
    } catch {
      check('seed.json could be loaded (open this page through a local server)', false, true);
    }

    document.getElementById('summary').textContent =
      `${passed} passed, ${failed} failed (${passed + failed} tests)`;
  </script>
</body>
</html>
